<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Inventaris SMK Informatika</title>
  <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/smkalirsyadinventaris/favicon-inventaris/main/64x64.png">
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#f8fafc; }
    iframe { display:block; width:100%; height:100%; border:0; background:#fff; }
    #loading { position:fixed; inset:0; display:grid; place-items:center;
      color:#334155; font:14px Arial,sans-serif; background:#f8fafc; pointer-events:none; }
  </style>
</head>
<body>
  <div id="loading">Memuat Inventaris SMK Informatika...</div>
  <iframe src="https://script.google.com/macros/s/AKfycbz3dB704ScJsJMzeOJ0owV9m6m3PxNh6XgnN5R4d-FGkHLBKhEycVuuPYQEzCXYlLQ0fQ/exec" title="Inventaris SMK Informatika"
          allow="clipboard-read; clipboard-write" allowfullscreen></iframe>
  <script>
    const frame = document.querySelector('iframe');
    frame.addEventListener('load', () => document.getElementById('loading')?.remove());
  </script>
</body>
</html>
